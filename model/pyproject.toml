[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-model"
version = "0.1.0"
description = "Per-cell logistic sea-ice forecast against cumulative CO2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "numba"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["model"]

[tool.setuptools.package-dir]
model = "."
